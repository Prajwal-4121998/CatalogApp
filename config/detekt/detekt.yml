build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  TooManyFunctions:
    active: true
    thresholdInClasses: 20
  LargeClass:
    active: true
    threshold: 600

naming:
  active: true
  FunctionNaming:
    active: true
    # Allow PascalCase for Composable functions - this is the correct Compose convention
    excludes: [ '**/ui/theme/**' ]
    functionPattern: '([a-z][a-zA-Z0-9]*)|(^[A-Z][a-zA-Z0-9]*$)'
  ClassNaming:
    active: true
  VariableNaming:
    active: true

style:
  active: true
  MagicNumber:
    active: true
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/ui/theme/**'
      - '**/designsystem/theme/**'
      - '**/designsystem/components/**'
    ignoreNumbers: [ '-1', '0', '1', '2' ]
    ignorePropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreHashCodeFunction: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  WildcardImport:
    active: true
  UnusedImports:
    active: true
  ReturnCount:
    active: true
    max: 3
  NewLineAtEndOfFile:
    active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - 'Exception'
      - 'Throwable'
      - 'RuntimeException'
  SwallowedException:
    active: true

potential-bugs:
  active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
