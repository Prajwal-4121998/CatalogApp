name: CatalogApp CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dkotlin.incremental=false"

jobs:
  # ── Job 1: Quality Gates ──────────────────────────────────────────────────
  lint-and-test:
    name: Lint + Test + Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDevDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

      - name: Generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Verify coverage threshold
        run: ./gradlew jacocoTestCoverageVerification --stacktrace

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-devDebug.html
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 7

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/detekt.html'
          retention-days: 7

  # ── Job 2: Build ──────────────────────────────────────────────────────────
  build:
    name: Build APK / AAB
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Decode keystore
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/catalogapp-release.jks
          echo "KEYSTORE_FILE=${{ github.workspace }}/catalogapp-release.jks" >> $GITHUB_ENV

      - name: Set signing environment variables
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        run: |
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Dev Debug APK (feature branches)
        if: github.ref_name != 'develop' && github.ref_name != 'main'
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Build Staging Debug APK (develop)
        if: github.ref_name == 'develop'
        run: ./gradlew assembleStagingDebug --stacktrace

      - name: Build Prod Release AAB (main)
        if: github.ref_name == 'main'
        run: ./gradlew bundleProdRelease --stacktrace

      - name: Upload Dev APK
        if: github.ref_name != 'develop' && github.ref_name != 'main'
        uses: actions/upload-artifact@v4
        with:
          name: dev-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          retention-days: 7

      - name: Upload Staging APK
        if: github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: staging-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/staging/debug/*.apk
          retention-days: 1

      - name: Upload Prod AAB
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: prod-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/prodRelease/*.aab
          retention-days: 1

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/catalogapp-release.jks

  # ── Job 3: Deploy ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy (Module 6 - pending UI)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'develop' || github.ref_name == 'main'

    steps:
      - name: Deploy placeholder
        run: echo "Firebase App Distribution configured in Module 6 after first UI screen"
